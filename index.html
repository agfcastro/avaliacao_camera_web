<!DOCTYPE html>
<html>
<head>

  <base href="/avaliacao_camera_web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AVALIAÇÃO - SME SYSTEM">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="AVALIAÇÃO - SME SYSTEM">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png"/>

  <title>AVALIAÇÃO - SME SYSTEM</title>
  <link rel="manifest" href="manifest.json">
   <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .indicator {
      width: 40vw;
      max-width: 200px;
      min-width: 100px;
      height: auto;
    }

    /* Telas muito pequenas (celular) */
    @media (max-width: 600px) {
      .indicator {
        width: 60vw;
        max-width: 180px;
      }
    }

    /* Telas grandes */
    @media (min-width: 1200px) {
      .indicator {
        width: 15vw;
        max-width: 220px;
      }
    }
  </style>
</head>
<body style="overflow: hidden">

  <canvas id="canvasDst" hidden="hidden"></canvas>
  <canvas id="canvasTmp" hidden="hidden"></canvas>
  <div id="loading_indicator" class="container">
    <img class="indicator" src="assets/assets/smesystem_loading.gif" />
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
